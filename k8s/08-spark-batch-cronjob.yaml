apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-batch-micro
  namespace: crypto-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: spark-batch-micro
            image: crypto-spark:latest
            imagePullPolicy: Never
            command:
            - /opt/spark/bin/spark-submit
            - --master
            - local[*]
            - /opt/spark/spark_scripts/jobs/batch_layer.py
            - --mode
            - micro
            - --offset-minutes
            - "180"
            envFrom:
            - configMapRef:
                name: crypto-config
            - secretRef:
                name: backend-secrets
            env:
            - name: PYTHONPATH
              value: /opt/spark/spark_scripts
            resources:
              requests:
                cpu: 300m
                memory: 768Mi
              limits:
                cpu: "1"
                memory: 1536Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: crypto-system
  labels:
    app: influxdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
      - name: influxdb
        image: influxdb:1.8
        ports:
        - containerPort: 8086
        env:
        - name: INFLUXDB_DB
          value: "crypto_data"
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: crypto-system
spec:
  selector:
    app: influxdb
  ports:
    - protocol: TCP
      port: 8086
      targetPort: 8086
  type: ClusterIP
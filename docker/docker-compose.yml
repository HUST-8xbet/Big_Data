networks:
  crypto-network:
    driver: bridge

# Định nghĩa Volumes để lưu trữ vĩnh viễn
volumes:
  postgres_data:
  minio_data:
  kafka_data:
  influxdb_data:

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: crypto_kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tự động tạo Topic Kafka (Chạy xong tự tắt)
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: crypto_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Đang khởi tạo các Topic cho dự án...' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic binance_live_prices --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic user_alerts_topic --partitions 1 --replication-factor 1 &&
      echo 'Tạo Topic thành công!'
      "
    networks:
      - crypto-network

  redpanda-console:
    image: redpandadata/console:latest
    container_name: crypto_redpanda_console
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - crypto-network

  minio:
    image: minio/minio:latest
    container_name: crypto_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: crypto_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Đang khởi tạo các Bucket...' &&
      mc alias set myminio http://minio:9000 admin password123 &&
      mc mb --ignore-existing myminio/raw-data &&
      mc mb --ignore-existing myminio/processed-data &&
      mc mb --ignore-existing myminio/ml-models &&
      echo 'Tạo Bucket thành công!'
      "
    networks:
      - crypto-network

  postgres:
    image: postgres:15
    container_name: crypto_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=cryptodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cryptodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: crypto_influx
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=crypto_org
      - DOCKER_INFLUXDB_INIT_BUCKET=crypto_prices
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=super-secret-token-12345
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: crypto_spark_master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../:/opt/project
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8080/ | grep 'Spark Master' > /dev/null"]
      interval: 10s
      retries: 5
      start_period: 15s

  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: crypto_spark_worker
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ../:/opt/project
    networks:
      - crypto-network
  spark-submit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: crypto_spark_submit
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf "spark.executorEnv.PYTHONPATH=/opt/project/spark_scripts"
      --conf "spark.executorEnv.KAFKA_BROKER=kafka:29092"
      --conf "spark.executorEnv.INFLUX_URL=http://influxdb:8086"
      /opt/project/spark_scripts/jobs/speed_layer_influx.py
    volumes:
      - ../:/opt/project
    environment:
      - PYTHONPATH=/opt/project/spark_scripts
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC_PRICES=binance_live_prices
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=super-secret-token-12345
      - INFLUX_ORG=crypto_org
      - INFLUX_BUCKET=crypto_prices
    networks:
      - crypto-network

  batch-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: crypto_batch_init
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/project/spark_scripts/jobs/batch_layer.py
      --mode batch
    volumes:
      - ../:/opt/project
    environment:
      - PYTHONPATH=/opt/project
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC_PRICES=binance_live_prices
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=cryptodb
      - PG_USER=admin
      - PG_PASSWORD=password123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    networks:
      - crypto-network
    restart: "no"

  batch-micro:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    container_name: crypto_batch_micro
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/project/spark_scripts/jobs/batch_layer.py
      --mode micro
      --offset-minutes 120
    volumes:
      - ../:/opt/project
    environment:
      - PYTHONPATH=/opt/project
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC_PRICES=binance_live_prices
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DB=cryptodb
      - PG_USER=admin
      - PG_PASSWORD=password123
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    networks:
      - crypto-network
    restart: "no"

  crawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.crawler
    container_name: crypto_crawler
    environment:
      - KAFKA_BROKER=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crypto-network
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_backend
    ports:
      - "8000:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=super-secret-token-12345
      - INFLUX_ORG=crypto_org
      - INFLUX_BUCKET=crypto_prices
      - DISPLAY_TZ=Asia/Ho_Chi_Minh
      - ALLOWED_ORIGINS=*
      - MODEL_PATH=/app/model.pt
      - LOAD_MODEL_FROM_MINIO=1
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
      - MINIO_MODEL_BUCKET=ml-models
      - MINIO_MODEL_KEY=lstm/model.pt
    depends_on:
      influxdb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - crypto-network
    restart: unless-stopped

  model-trainer-minio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml-trainer
    container_name: crypto_model_trainer_minio
    command: python spark_scripts/ml/train_from_minio.py
    profiles:
      - training
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
      - MINIO_TRAIN_BUCKET=raw-data
      - MINIO_TRAIN_PREFIX=binance/
      - MINIO_MODEL_BUCKET=ml-models
      - MINIO_MODEL_KEY=lstm/model.pt
      - MODEL_PATH=/app/spark_scripts/ml/artifacts/model.pt
      - TRAIN_DAYS=7
      - UPLOAD_MODEL_TO_MINIO=1
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - crypto-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend-k8s
      args:
        # Đặt SERVER_IP=<ip_server> trong file .env trước khi chạy
        - VITE_API_URL=http://${SERVER_IP:-localhost}:8000
        - VITE_WS_URL=ws://${SERVER_IP:-localhost}:8000
    container_name: crypto_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - crypto-network
    restart: unless-stopped
